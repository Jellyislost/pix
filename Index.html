<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly's Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="profile-section">
            <div class="avatar"></div>
            <h2>GALLERY</h2>
        </div>
        <div class="menu-items">
            <div class="menu-item active">Photos</div>
            <div class="menu-item">Projects</div>
            <div class="menu-item">About</div>

    <main class="content">

            <h1>RAW SHOTS // <span>FILE_01</span></h1>
        </div>

            <div class="photo-card">

                <div class="photo-info">IMG_002.RAW</div>
            </div>

            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Landscape">
                <div class="photo-info">IMG_003.RAW</div>
            </div>
            
            </div>
    </main>
